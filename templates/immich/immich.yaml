apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  sources:
  - repoURL: 'oci://ghcr.io/immich-app/immich-charts/immich'
    chart: immich
    targetRevision: 0.12.0
    helm:
      values: |-
        # These entries are shared between all the Immich components
        controllers:
          main:
            containers:
              image:
                tag: v2.6.3
              env:
                DB_HOSTNAME: 'immich-postgres-rw'
              envFrom:
                - secretRef:
                    name: immich-postgres-user


        immich:
          persistence:
            # Main data store for all photos shared between different components.
            library:
              # Automatically creating the library volume is not supported by this chart
              # You have to specify an existing PVC to use
              existingClaim: photos

        # Dependencies

        valkey:
          enabled: true
          architecture: standalone
          auth:
            enabled: false

        # Immich components

        server:
          enabled: true
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
          ingress:
            main:
              enabled: true
              hosts:
                - host: immich.familielux.org
                  paths:
                    - path: "/"

        machine-learning:
          resources:
            limits:
              cpu: 1000m
              memory: 4Gi
          enabled: true
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
          persistence:
            cache:
              enabled: true
              size: 10Gi
              # Optional: Set this to persistentVolumeClaim to avoid downloading the ML models every start.
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              storageClass: local-path
  - repoURL: https://github.com/CreateRandom/homelab-apps
    path: templates/immich/extra
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  project: default
